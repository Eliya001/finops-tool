apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: finops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        project: finops-tool
        env: dev
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: migrate
          image: finops-backend:dev
          imagePullPolicy: IfNotPresent
          command: ["node", "src/db/migrate.js"]
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: finops-db
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: backend
          image: finops-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: finops-db
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
