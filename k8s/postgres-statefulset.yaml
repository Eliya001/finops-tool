apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: finops
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        project: finops-tool
        env: dev
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: finops
            - name: POSTGRES_DB
              value: finops_db
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finops-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgreqsl/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "finops", "-d", "finops_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

